<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>台股研究桌</title><style>
:root{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:#0b1423;color:#e0e8f5}*{box-sizing:border-box}body{margin:0}header{background:#132139;border-bottom:1px solid #34465e;padding:20px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:23px;margin:0}h2{font-size:22px}h3{font-size:17px;margin-top:0}small,.muted{color:#a7b9d1}button,select,input{font:inherit;color:inherit;background:#233853;border:1px solid #4b637e;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:hover{background:#36526e}button.active,.primary{background:#137f87}button:disabled{opacity:.5;cursor:wait}nav{padding:12px 28px;display:flex;gap:8px;flex-wrap:wrap}main{max-width:1440px;padding:0 28px 50px;margin:auto}.card{padding:20px;background:#15243b;border:1px solid #2c405b;border-radius:10px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.metric{font-size:32px;font-weight:bold;margin:12px 0}.warn{background:#302c23;color:#ffe1a9;border-left:4px solid #e2ad59;padding:14px;line-height:1.8}.tag{display:inline-block;background:#29405d;border-radius:4px;padding:4px 7px;margin:2px;font-size:12px}.good{color:#81d4c3}.hot{color:#ffa2a2}p{line-height:1.8}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px 8px;text-align:left;border-bottom:1px solid #30415a;white-space:nowrap}th{color:#9eb7d5}.click{cursor:pointer}.click:hover{background:#26425c}a{color:#7cdee0}textarea{background:#0a1526;color:#dae9fb;width:100%;height:420px;border:1px solid #4a6384;padding:14px;font:14px/1.6 Consolas,'Microsoft JhengHei',monospace}details{margin:12px 0}summary{cursor:pointer;color:#a8cfec}pre{white-space:pre-wrap;word-break:break-word;font:13px/1.7 Consolas,'Microsoft JhengHei',monospace}#status{padding:10px 28px;color:#a9d8df;font-size:14px;line-height:1.7}canvas{display:block;width:100%;height:310px}dialog{width:88%;max-width:1040px;background:#13243a;color:#dfebfc;border:1px solid #516c8e;border-radius:10px;max-height:95vh;overflow:auto}label{display:inline-flex;gap:8px;align-items:center;margin:8px 8px 8px 0}.score{font-weight:bold;font-size:25px}.empty{padding:24px;text-align:center;color:#b1c0d4}.bar{height:10px;background:#31455e;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#31afab}.split{display:flex;gap:15px;flex-wrap:wrap;align-items:center}
</style><header><div><h1>台股研究桌 <small style="font-size:12px">v0.3</small></h1><small>本機資料 · 規則研究 · 不自動交易</small></div><select id="type" aria-label="報告類型"><option value="pre">盤前</option><option value="post" selected>盤後</option></select><button id="update" class="primary">立即更新</button><select id="history" aria-label="歷史報告"></select><button id="copy">複製 AI 分析資料</button><button id="download">匯出 Markdown</button></header><div id="status" role="status">讀取本機報告…</div><nav id="nav"></nav><main id="main"></main><dialog id="detail"><button id="close">關閉</button><div id="detailBody"></div><canvas id="price"></canvas><canvas id="volume"></canvas></dialog><script type="module">
const token='__TOKEN__',$=s=>document.querySelector(s),esc=s=>String(s??'缺漏').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state,tab='總覽',selected='',signature='',market='全部',kind='全部',etfType='一般／主動';
const tabs=['總覽','短線類股','長線基本面','ETF','美股與新聞','資料品質','規則與設定','AI 文字'];const pp=x=>x==null?'缺漏':(x*100).toFixed(2)+' 個百分點';const pct=x=>x==null?'缺漏':(x*100).toFixed(2)+'%',amount=x=>x==null?'缺漏':(x/1e8).toFixed(2)+'億',tags=a=>(a??[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(''),time=(t,z='Asia/Taipei')=>t?new Date(t).toLocaleString('zh-TW',{timeZone:z,hour12:false})+' '+z:'未知';
async function api(url,body){let r=await fetch('/api/'+url,{headers:{'X-App-Token':token,'Content-Type':'application/json'},...(body!==undefined?{method:'POST',body:JSON.stringify(body)}:{})});let j=await r.json();if(!r.ok)throw Error(j.error??'操作失敗');return j;}
$('#nav').innerHTML=tabs.map(t=>`<button data-tab="${t}">${t}</button>`).join('');$('#nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render();}};
function evidence(s){return `<div class="split"><span class="score">${s.total??'未完整評分'}</span><span>已知 ${s.known}／已知權重 ${s.completeness}（不換算100分）</span></div><p>${s.inputs.rs60!==undefined?'中期趨勢／營收／獲利品質／籌碼／同業支持':'相對強度／群體／資金／籌碼／持續性'}：${s.parts.map(x=>x??'缺漏').join(' / ')}</p>${s.trendComponents?`<p>相對強度 ${s.trendComponents.relativeStrengthPoints??'缺'}／${s.trendComponents.relativeWeight}；絕對趨勢 ${s.trendComponents.absoluteTrendPoints??'缺'}／${s.trendComponents.absoluteWeight}；集中度扣 ${s.concentrationPenalty??0}分。總分已扣罰。</p>`:''}`;}
function stockTable(stocks,market){return `<div class="scroll"><table><tr><th>股票</th><th>收盤</th><th>5日／20日絕對報酬</th><th>5日／20日超額報酬</th><th>成交金額</th><th>5日外資／投信淨股數</th><th>標籤／風險</th></tr>${stocks.map(x=>`<tr class="click" data-code="${esc(x.code)}" data-market="${esc(market??x.market)}"><td>${esc(x.code)} ${esc(x.name)}</td><td>${x.close}</td><td>${pct(x.r5??x.return5)} / ${pct(x.r20??x.return20)}</td><td>${pp(x.rs5)} / ${pp(x.rs20)}</td><td>${amount(x.amount)}</td><td>${x.foreign?.toLocaleString()??'缺'} / ${x.trust?.toLocaleString()??'缺'}</td><td>${tags(x.labels)}${tags(x.risks)}</td></tr>`).join('')}</table></div>`;}
function sectorCard(s){let qualified=[...state.report.candidates,...(state.report.themeCandidates??[])].some(x=>x.name===s.name&&x.market===s.market&&x.kind===s.kind);return `<section class="card"><h3>${esc(s.name)} ${tags([s.kind,s.market,s.date,...(qualified?['通過入選門檻']:[])])}</h3>${evidence(s)}<p>有效成分 ${s.valid}/${s.count}（${pct(s.coverage)}） · 共同轉強 ${s.strong} 檔 · 等權當日 ${s.dayChange?.toFixed(2)??'缺漏'}% · 成交 ${amount(s.amount)}</p><p>${tags(s.risks)}</p><p><b>數據事實：</b>5日絕對報酬 ${pct(s.return5)}；相對大盤超額 ${pp(s.inputs.rs5)}；站上20日均線 ${pct(s.inputs.above)}；活躍倍數 ${s.inputs.active?.toFixed(2)??'缺漏'}。<br><b>相關事件：</b>見美股與新聞頁，僅RSS標題。<br><b>可能關聯：</b>事件與量價同時出現不代表因果。</p><details><summary>計分輸入、分類依據與排名方式</summary><pre>${esc(JSON.stringify({inputs:s.inputs,evidence:s.evidence},null,2))}</pre><p>${esc(s.basis??'官方產業代碼對照')}<br>${esc(s.rankBasis)}</p></details><p><b>入選檢查：</b>${esc(s.qualification?.qualified?'通過所有門檻':(s.qualification?.failed??['舊報告未提供明細，請更新']).join('；'))}</p><p><b>最大成交額成分：</b>${esc(s.concentration?.largestCode)}，占比 ${pct(s.concentration?.largestAmountShare)}；排除後基礎分 ${s.concentration?.withoutLargest?.known??'缺漏'}／已知權重 ${s.concentration?.withoutLargest?.completeness??'缺漏'}（不含持續性，不換算100分）；排除後5日絕對報酬 ${pct(s.concentration?.withoutLargest?.return5)}／5日超額 ${pp(s.concentration?.withoutLargest?.relativeStrength5)}</p>${stockTable(s.stocks,s.market)}</section>`;}
function financial(f){if(!f)return '<p>尚無財報</p>';return `<p>期間 ${esc(f.period)}；${esc(f.basis??f.form)}<br>營收 ${f.revenue?.toLocaleString()??'缺漏'} ${esc(f.unit)}；淨利 ${f.netIncome?.toLocaleString()??'缺漏'}<br>毛利率 ${pct(f.grossMargin)}；營益率 ${pct(f.operatingMargin)}<br>公布／申報日 ${esc(f.publication)}；保守可用時間 ${time(f.availableAt)}<br><a href="${esc(f.source)}" target="_blank" rel="noreferrer">原始來源</a></p>`;}
function render(){if(!state)return;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let r=state.report,html='';if(tab==='規則與設定'){html=`<h2>規則、排程與題材設定</h2><div class="card"><p>排程採台灣時間，主程式開啟才會執行；只補當日漏跑報告。historySessions 預設65，已取得日期不會重抓。美股追蹤清單可修改；新增SEC公司可在usCiks指定10位CIK。</p><textarea id="config">${esc(JSON.stringify(state.config,null,2))}</textarea><button id="save">儲存設定</button><span id="saved"></span></div>${rulesHelp()}<div class="card"><h3>本機容量與6GB上限</h3><p>目前 ${(state.storage.bytes/1024**2).toFixed(1)} MB；行情 ${state.storage.bars.toLocaleString()} 筆，報告 ${state.storage.reports} 份。</p><div class="bar"><i style="width:${Math.min(100,state.storage.bytes/state.storage.limitBytes*100)}%"></i></div><p>警示 ${(state.storage.warnBytes/1024**3).toFixed(1)} GB／上限 ${(state.storage.limitBytes/1024**3).toFixed(1)} GB。${esc(state.storage.canClean)}</p><p>自動快取清理 ${state.storage.autoClean?'已開啟':'未開啟'}；不會為了達上限自行刪除行情或歷史報告。</p><button id="clean">清理可重下載快取</button><p id="cleanResult"></p></div>`;}else if(!r){html='<h2>建立第一份真實報告</h2><p>按立即更新下載官方行情，首次補齊歷史可能需要數分鐘，後續採增量更新。</p>';}else if(!r.version){html='<h2>舊版歷史報告</h2><p>此份為舊版格式，請更新產生v0.2報告，或在AI文字頁檢視原始報告。</p><textarea readonly>'+esc(r.text)+'</textarea>';}else if(tab==='總覽'){html=`<h2>${r.type==='pre'?'盤前':'盤後'}研究報告 · ${r.day}</h2><p class="muted">報告時間 ${time(r.generated)}。開啟先顯示本機報告；按立即更新才檢查來源。</p><div class="grid">${r.markets.map(m=>`<div class="card"><h3>${m.market} · ${m.date}</h3><div class="metric">${amount(m.amount)}</div><p>指數 ${m.benchmark??'缺漏'}；${m.count} 檔股票與ETF<br>上漲 ${m.up}／下跌 ${m.down}；本機 ${m.historySessions??0} 個交易日</p><p>普通股站上均線比例：${[5,20,60].map(n=>`${n}日 ${pct(m.breadth?.['ma'+n]?.ratio)}（${m.breadth?.['ma'+n]?.above??'缺'}/${m.breadth?.['ma'+n]?.eligible??'缺'}）`).join('；')}</p><p>反彈確認：${esc(m.rebound?.status??'舊報告未提供，請更新')}；前20日最高收盤 ${m.rebound?.previous20SessionHigh??'缺'}；普通股成交額／前5日均額 ${m.rebound?.stockAmountRatioVsPrior5?.toFixed(2)??'缺'}倍。${esc(m.rebound?.basis??'')}</p><p class="muted">${esc(m.status)}；預期日期 ${m.expected??'未知'}</p><details><summary>本次實際計算日期與來源</summary><pre>${esc(JSON.stringify(m.calculationInputs??'舊報告未提供，請更新',null,2))}</pre></details></div>`).join('')}</div><div class="card"><h3>前5個關注類股</h3>${r.candidates.length?r.candidates.map(s=>`<p>${s.market} ${s.name} <b>${s.total}分</b> · ${s.strong}檔共同轉強</p>`).join(''):'<p>本次沒有同時通過分數與所有門檻的類股，不湊數。可到短線類股檢查分數及反證。</p>'}<canvas id="sectorChart"></canvas><p class="muted">官方產業完整分數排行；上市／上櫃對應各自大盤。高分仍須通過共同轉強與覆蓋門檻。</p></div><div class="warn">未回測初始規則，不具已證實預測能力。未還原價格可能受除權息影響；財報與缺漏分數不重新分配權重。</div>`;}else if(tab==='短線類股'){html=`<h2>短線類股與AI題材</h2><label>市場 <select id="market">${['全部','TWSE','TPEX'].map(x=>`<option ${x===market?'selected':''}>${x}</option>`).join('')}</select></label><label>分類 <select id="kind">${['全部','官方產業','AI題材'].map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select></label><p>完整總分與資料不足分開判讀；題材重疊成分不可加總。點股票看本機價格／成交量。</p>${r.sectors.filter(s=>(market==='全部'||s.market===market)&&(kind==='全部'||s.kind===kind)).map(sectorCard).join('')}`;}else if(tab==='長線基本面'){html=`<h2>台股AI公司長線觀察</h2><p>先看中期族群支持，再看公司基本面；不同完整度不比較完整總分。營收為最近連續3個月合計年增，財報嚴格區分單季與累計。</p>${r.fundamentals.map(f=>`<div class="card"><h3>${f.code} ${esc(f.name)} ${tags([f.market,f.industry,f.status])}</h3>${evidence(f)}<p>60日超額 ${pp(f.inputs.rs60)}；60日均線5日方向 ${pct(f.inputs.ma60Slope)}<br>3月合計營收年增 ${pct(f.revenue3?.yoy)}；月份 ${(f.revenue3?.periods??[]).join('、')||'資料不足'}<br>20日絕對報酬 ${pct(f.return20)}；中期族群支持 ${esc(f.mediumTermPeerSupport??f.sectorStrong??null)}（60日同業條件，非短線強勢）<br>外資20日 ${f.foreign20?.toLocaleString()??'缺'}股／投信 ${f.trust20?.toLocaleString()??'缺'}股</p><p>營收資料月份 ${(f.freshness?.revenueWindow??[]).join('、')||'缺漏'}；落後 ${f.freshness?.revenueLagMonths??'未知'} 個月。財報 ${esc(f.freshness?.latestFinancialPeriod)}；距季末 ${f.freshness?.quarterAgeDays??'未知'} 天；單季可比且新鮮 ${esc(f.freshness?.financialComparable??'舊報告未提供')}。近3月合計不代表本月成長動能。</p><p>${esc(f.financialBasis)}；相鄰前季單季 ${f.previousFinancial?esc(f.previousFinancial.period):'缺漏，不能評估季獲利品質變化'}</p>${financial(f.financial)}${tags(f.risks)}<details><summary>輸入與資料可用時間</summary><pre>${esc(JSON.stringify({inputs:f.inputs,sources:f.sources},null,2))}</pre></details></div>`).join('')}`;}else if(tab==='ETF'){html=`<h2>ETF獨立觀察</h2><label>類型 <select id="etfType">${['一般／主動','槓桿','反向'].map(x=>`<option ${etfType===x?'selected':''}>${x}</option>`).join('')}</select></label><p>不套用公司財報評分。持股未知時不宣稱已檢查重複曝險。</p>${r.etfs.filter(x=>x.etfType===etfType).map(x=>`<div class="card"><h3>${x.code} ${esc(x.name)} ${tags([x.market,x.date,x.etfType])}</h3><p>追蹤：${esc(x.tracking)}${x.metadataSource?` <a href="${esc(x.metadataSource)}" target="_blank">資料依據</a>`:''}<br>標的資料取得 ${time(x.metadataFetched)}（來源未標版本日）<br>可能產業關聯 ${esc(x.relatedIndustries?.join("、")||"無可辨識關鍵詞")}；正式強勢類股關聯 ${esc(x.relatedStrongSectors?.join("、")||"無")}<br>${esc(x.relationBasis)}<br>5日 ${pct(x.return5)}／20日 ${pct(x.return20)}；活躍 ${x.active?.toFixed(2)??'缺'}倍</p>${stockTable([x])}<p>持股日 ${esc(x.holdingsDate)}；${x.holdings?'已維護持股，需核對日期':'未取得持股，無法計算重複曝險'}</p></div>`).join('')}`;}else if(tab==='美股與新聞'){html=`<h2>美國動向與限定日期新聞</h2><div class="card"><p>最近已完成美股交易日：<b>${esc(r.usCalendar?.date)}</b><br>${esc(r.usCalendar?.status)}<br><a href="${esc(r.usCalendar?.source)}" target="_blank">NYSE日曆依據</a></p>${tags(r.watchlist)}<div class="scroll"><table><tr><th>代號</th><th>日期</th><th>收盤</th><th>日報酬</th><th>狀態</th></tr>${(r.usPrices??[]).map(x=>`<tr><td>${x.code}</td><td>${esc(x.date)}</td><td>${esc(x.close)}</td><td>${pct(x.change)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div><details><summary>匯入自己有權使用的美股每日CSV</summary><p>本版未設定可涵蓋全部追蹤標的的自動來源，本版尚未接自動報價；CSV是匯入後備，不是美股必須手動輸入。SEC只供財報，不供每日收盤價。股票與SPX／NDX／SOX等指數需分開確認資料涵蓋與方案。CSV欄位：symbol,date,close,volume；date為美東交易日。匯入後按立即更新納入報告。</p><label>資料來源 <input id="importSource" placeholder="例如來源網址或資料提供者"></label><label>CSV檔案 <input type="file" id="csvFile" accept=".csv,text/csv"></label><button id="import">匯入CSV</button><p id="importResult"></p></details></div><h3>SEC財報（與台股分開）</h3><div class="grid">${(r.usFundamentals??[]).map(f=>`<div class="card"><h3>${f.code} ${esc(f.name)}</h3>${financial(f.financial)}<p>可比去年同期間營收年增 ${pct(f.revenueYoY)}；前季毛利率變化 ${pct(f.marginChange)}</p><p class="muted">${esc(f.status)}<br>${esc(f.risk)}</p></div>`).join('')}</div><h3>當日相關事件</h3><p>${esc(r.newsStatus)}</p>${r.news.length?r.news.map(n=>`<div class="card"><h3><a href="${esc(n.url)}" target="_blank" rel="noreferrer">${esc(n.title)}</a></h3><p>${esc(n.source)} · ${time(n.published,n.market==='US'?'America/New_York':'Asia/Taipei')}<br>${esc(n.scope)}；相關事件，不是因果證據</p>${tags(n.topics)}<p>${n.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.name)} ${time(s.published,n.market==='US'?'America/New_York':'Asia/Taipei')}</a>`).join('<br>')}</p></div>`).join(''):'<p>已取得RSS涵蓋範圍內無相關當日新聞，不以舊聞補足。</p>'}`;}else if(tab==='資料品質'){html=`<h2>來源、更新時間與缺漏</h2><button id="audit">匯出完整報告 JSON</button>${r.sources.map(s=>`<div class="card"><h3>${esc(s.name)} ${tags([s.status])}</h3><p>來源日 ${esc(s.date)}；取得 ${time(s.fetched)}；筆數 ${s.rows??0}；快取 ${s.cached?'是':'否'}；用途 ${esc(s.role??(s.usedForCalculation?'實際計算輸入':'依資料種類參考'))}；計算日 ${esc(s.calculationDate??s.date)}<br>${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noreferrer">${esc(s.url)}</a>`:''}</p>${s.error||s.warning?`<div class="warn">${esc(s.error??s.warning)}</div>`:''}</div>`).join('')}<div class="warn">${r.limitations.map(esc).join('<br>')}</div>`;}else if(tab==='AI 文字'){html='<h2>本份報告的完整AI文字</h2><p>與畫面使用同一報告物件；本機複製或匯出，由你決定是否貼給AI。</p><textarea readonly id="export"></textarea>';}
signature=JSON.stringify([state.report?.generated,tab]);$('#main').innerHTML=html;if($('#export'))$('#export').value=r.text;if($('#audit'))$('#audit').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json;charset=utf-8'}));a.href=url;a.download=r.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};if($('#sectorChart'))plot($('#sectorChart'),r.sectors.filter(x=>x.kind==='官方產業'&&x.total!=null).slice(0,10).map(x=>({label:x.name+' '+x.market,value:x.total})),'完整100分排行',true);if($('#market'))$('#market').onchange=e=>{market=e.target.value;render();};if($('#kind'))$('#kind').onchange=e=>{kind=e.target.value;render();};if($('#etfType'))$('#etfType').onchange=e=>{etfType=e.target.value;render();};if($('#save'))$('#save').onclick=async()=>{try{await api('config',JSON.parse($('#config').value));$('#saved').textContent=' 已儲存，下次更新採用';}catch(e){$('#saved').textContent=' '+e.message;}};if($('#clean'))$('#clean').onclick=async()=>{try{let x=await api('clean',{});$('#cleanResult').textContent=x.message+' 清除 '+x.removed+' 筆快取。';}catch(e){$('#cleanResult').textContent=e.message;}};if($('#import'))$('#import').onclick=async()=>{try{let f=$('#csvFile').files[0];if(!f)throw Error('請選CSV');let x=await api('import-us',{csv:await f.text(),source:$('#importSource').value});$('#importResult').textContent=x.message+' '+x.rows+'筆';}catch(e){$('#importResult').textContent=e.message;}};}
function rulesHelp(){return `<div class="card"><h3>規則定義與換算</h3><p>有效成分：至少26個與市場對齊的交易日、近5日平均成交額達門檻、無超過25%價格跳動。類股指標等權，不以市值加權。對應大盤為上市加權與櫃買指數。</p><p>以下為預設權重，實際依設定的weights及longWeights計分。C(x)=max(0,min(1,x))。舊版相對強度公式（新報告僅分配強度項的一半權重）：30×[C((5日超額+.05)/.10)+C((20日超額+.10)/.20)]/2；群體25×(上漲比例+20日均線以上比例)/2；資金20×[C((均額比−.5)/1.5)+C((占市場成交比相對變化+.25)/.5)]/2；籌碼15×(外資正+投信正+兩者合計正的成分比例)/3；持續性10×最近5日90分基礎排名前5比例。</p><p>共同轉強：5日報酬正、站上20日均線、5日均額大於前段不重疊20日。rank=null表示當日未取得排名資格，原因見排名證據的exclusionReasons；不足3檔或覆蓋不足的題材只獨立觀察。新報告強度項預設各15分：相對強度依原公式取半，絕對趨勢15×[C(5日報酬/.05)+C(20日報酬/.10)]/2；非正報酬不加該期絕對分。最大成分成交額占比超過50%至100%線性扣0至20分。五項分數合計再扣集中度，缺資料不補分。候選另須5日絕對報酬正、計算價格與指數同日。此為未回測研究規則。候選須完整分數至少70、5日超額正、半數站上均線、3檔共同轉強及至少60%成分有效。持續排名以本次分類重算，不是歷史實際名單。</p><p>長線權重25/25/25/15/10。價格比較60日超額與均線方向；營收比較連續3月合計年增與正成長比例；獲利品質需單季淨利、毛利率、營益率及前季變化；籌碼20日；同業至少3家公司營收與價格改善。缺任何維度不給完整總分，不重配權重。精確公式見RULES-v0.2.md與程式純函式。</p><p>領先股：有效成分5日超額前30%、超額正且成交活躍1.2倍以上；基本面支持：近3個實際月份營收年增正、營收落後不超過2個月、最新單季距季末不超過200天、相鄰前季不超過300天，兩季可比且最新單季淨利正；超期不授予支持標籤、不計該基本面維度。取得時間不代表資料期間新鮮。</p></div>`;}
function plot(canvas,points,title,bars=false){let w=canvas.clientWidth||800,h=310,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;let c=canvas.getContext('2d');c.scale(dpr,dpr);c.font='13px Microsoft JhengHei';c.fillStyle='#bdcfe5';c.fillText(title,12,22);if(!points.length){c.fillText('無可用資料',24,70);return;}if(bars){let max=Math.max(1,...points.map(x=>x.value)),step=245/points.length;points.forEach((p,i)=>{c.fillStyle='#bcd0e7';c.fillText(p.label,10,48+i*step);let bw=(w-260)*p.value/max;c.fillStyle='#39b6b3';c.fillRect(165,35+i*step,bw,step-6);c.fillStyle='#e1efff';c.fillText(p.value.toFixed(2),172+bw,48+i*step);});return;}let values=points.map(x=>x.value),min=Math.min(...values),max=Math.max(...values),span=max-min||1;let xy=(p,i)=>[70+i*(w-110)/Math.max(1,points.length-1),250-(p.value-min)/span*190];c.strokeStyle='#54c4cd';c.lineWidth=2;c.beginPath();points.forEach((p,i)=>{let[x,y]=xy(p,i);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();points.forEach((p,i)=>{let[x,y]=xy(p,i);c.fillStyle='#54c4cd';c.beginPath();c.arc(x,y,2,0,7);c.fill();});c.fillStyle='#bcd0e7';c.fillText(max.toFixed(2),4,60);c.fillText(min.toFixed(2),4,250);c.fillText(points[0].label,70,282);if(points.length>1)c.fillText(points.at(-1).label,w-120,282);}
$('#main').onclick=async e=>{let tr=e.target.closest('[data-code]');if(!tr)return;let rows=await api('bars?market='+encodeURIComponent(tr.dataset.market)+'&code='+encodeURIComponent(tr.dataset.code));$('#detailBody').innerHTML=`<h2>${esc(tr.cells[0].textContent)}</h2><p>本機 ${rows.length} 個交易日；收盤價未還原，除權息可能影響趨勢。</p>`;$('#detail').showModal();plot($('#price'),rows.map(x=>({label:x.date,value:x.close})),'收盤價（未還原）');plot($('#volume'),rows.filter(x=>x.volume!=null).map(x=>({label:x.date,value:x.volume})),'成交股數');};$('#close').onclick=()=>$('#detail').close();
async function refresh(){try{state=await api('state'+(selected?'?id='+encodeURIComponent(selected):''));$('#status').textContent=(state.job.running?'更新中：':'狀態：')+state.job.message+(state.job.error?'；錯誤：'+state.job.error:'')+' ｜ 最後行情取得 '+time(state.lastSuccessfulData)+' ｜ 資料庫 '+(state.storage.bytes/1024**2).toFixed(1)+' MB';$('#update').disabled=state.job.running;let sig=JSON.stringify([state.report?.generated,tab]);if(sig!==signature){signature=sig;$('#history').innerHTML=state.history.map(x=>`<option value="${x.id}">${x.day} ${x.type==='pre'?'盤前':'盤後'}</option>`).join('')||'<option>尚無報告</option>';$('#history').value=state.report?.id??'';render();}}catch(e){$('#status').textContent='連線失敗：'+e.message;}}
$('#update').onclick=async()=>{selected='';await api('update?type='+$('#type').value,{});await refresh();};$('#history').onchange=async()=>{selected=$('#history').value;signature='';await refresh();};$('#copy').onclick=async()=>{if(!state.report)return;try{await navigator.clipboard.writeText(state.report.text);$('#status').textContent='瀏覽器回報已複製，請貼上確認';return;}catch{}try{await api('copy-report',{id:state.report.id,generated:state.report.generated});$('#status').textContent='已複製並核對Windows系統剪貼簿';}catch{tab='AI 文字';render();$('#export').select();$('#status').textContent=document.execCommand('copy')?'已複製選取文字':'請按Ctrl+C複製已選取文字，或使用匯出';}};$('#download').onclick=()=>{if(!state.report)return;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([state.report.text],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download=state.report.id+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};await refresh();setInterval(refresh,2000);
</script></html>
